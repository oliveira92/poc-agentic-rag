spring:
  application:
    name: agentic-rag

  # Java 25: virtual threads para I/O barato (portal + DB + LLM)
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${DB_USERNAME:rag}
    password: ${DB_PASSWORD:rag}

  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    # ---------- Chat model: Anthropic Claude ----------
    anthropic:
      # placeholder permite o contexto subir sem chave (ingestão/recuperação funcionam);
      # só as chamadas de chat (advise) falham até você configurar a chave real.
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          # Spring AI 2.0 NÃO envia mais um 'temperature' default — então a família Claude 5
          # (que deprecou o parâmetro) volta a funcionar. Use um id EXATO da sua conta
          # (GET /v1/models). Para forçar temperature, adicione: temperature: 0.2
          model: ${ANTHROPIC_CHAT_MODEL:claude-sonnet-5}

    # ---------- Embeddings locais MULTILÍNGUES (ONNX) ----------
    # paraphrase-multilingual-MiniLM-L12-v2: bom em PT-BR e ainda 384 dims
    # (mesma dimensão do MiniLM inglês => NÃO precisa migrar o schema).
    # Baixado do HuggingFace na 1ª subida e cacheado localmente.
    embedding:
      transformer:
        onnx:
          model-uri: https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model.onnx
          model-output-name: last_hidden_state
        tokenizer:
          uri: https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json

    # ---------- Vector store pgvector (memória de LONGO prazo) ----------
    vectorstore:
      pgvector:
        initialize-schema: false   # schema é criado via Flyway (DDL explícito)
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 384
        table-name: vector_store

    # ---------- Chat: memória de conversa (CURTO prazo) + observabilidade ----------
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never   # criado via Flyway
      # Anexa o texto de prompt/completion aos spans. Verifique o nome exato da
      # propriedade na versão do spring-ai que você fixar (não é fatal se ignorada).
      client:
        observations:
          log-prompt: true
      observations:
        log-completion: true

# ---------- Tracing -> OTLP -> Langfuse (v3) ----------
management:
  tracing:
    sampling:
      probability: 1.0   # PoC: amostra tudo. Em produção reduza.
  # Boot 4 moveu as propriedades OTLP de tracing de 'management.otlp.tracing.*' (Boot 3)
  # para 'management.opentelemetry.tracing.export.otlp.*'.
  opentelemetry:
    tracing:
      export:
        otlp:
          # Endpoint montado a partir de LANGFUSE_BASE_URL (caminho OTLP do Langfuse v3).
          # O header Basic Authorization é computado de LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY
          # em AgenticRagApplication.main() (placeholder não faz base64).
          endpoint: ${LANGFUSE_BASE_URL:http://localhost:3000}/api/public/otel/v1/traces
  # Só queremos TRACES no Langfuse. O starter também traz o export de métricas OTLP
  # (default :4318); desligamos para não poluir o log com falhas de conexão.
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# ---------- App ----------
app:
  embedding:
    # Id lógico do modelo de embeddings. É incluído no hash de idempotência: ao trocar
    # o modelo (aqui e no bloco spring.ai.embedding), este id muda e força a re-ingestão
    # (re-embed), evitando misturar vetores de modelos diferentes na mesma tabela.
    model-id: ${APP_EMBEDDING_MODEL_ID:paraphrase-multilingual-MiniLM-L12-v2}

  # ---------- M03 · Camada 5 (Governança): roteamento por risco ----------
  # "Aliases de negócio → modelo real" (A05). Por padrão os três apontam para o mesmo
  # modelo (comportamento inalterado). Aponte fast-model p/ um modelo mais barato e o
  # roteamento por custo entra em ação (gráfico "−44%" da aula), mantendo o forte no risco.
  routing:
    strong-model: ${APP_ROUTING_STRONG_MODEL:${ANTHROPIC_CHAT_MODEL:claude-sonnet-5}}
    fast-model: ${APP_ROUTING_FAST_MODEL:${ANTHROPIC_CHAT_MODEL:claude-sonnet-5}}
    default-model: ${APP_ROUTING_DEFAULT_MODEL:${ANTHROPIC_CHAT_MODEL:claude-sonnet-5}}
    threshold-high: 0.90       # SLO de groundedness da rota de risco (jurídico/pagamento)
    threshold-default: 0.80

  # ---------- M03 · Camada 3 (Qualidade): juiz de groundedness ----------
  quality:
    judge: ${APP_QUALITY_JUDGE:mock}   # mock (default, roda no CI sem chave) | llm (LLM-as-judge)
    gate:
      trap-floor: 0.35        # score de similaridade abaixo do qual "nada foi recuperado" (armadilhas)
      min-pass-rate: 0.75     # taxa mínima de aprovação do golden set para o gate passar
      top-k: 6

  # ---------- M03 · Camada 4 (Negócio): custo por token ----------
  # Preço por 1k tokens para estimar custo/chamada (custo mora nos tokens — A04).
  # Ajuste para os preços reais do seu provedor/moeda; 0 = não estima.
  cost:
    currency: ${APP_COST_CURRENCY:USD}
    input-per-1k: ${APP_COST_INPUT_PER_1K:0.0}
    output-per-1k: ${APP_COST_OUTPUT_PER_1K:0.0}

  # ---------- Seleção de modelos Anthropic (governança de modelo — A05) ----------
  # O catálogo é a allow-list VERSIONADA de modelos que o /advise aceita no campo "model".
  # Com live-sync=true, GET /api/v1/models também lista os modelos REAIS da conta
  # (Anthropic /v1/models) — a fonte da verdade dos ids exatos. allow-any=true desliga a
  # validação (para contas com ids fora do catálogo). Os ids abaixo são os padrões atuais;
  # ajuste para os ids exatos da SUA conta (a listagem ao vivo mostra quais existem).
  models:
    allow-any: ${APP_MODELS_ALLOW_ANY:false}
    live-sync: ${APP_MODELS_LIVE_SYNC:true}
    base-url: ${APP_MODELS_BASE_URL:https://api.anthropic.com}
    cache-ttl: ${APP_MODELS_CACHE_TTL:PT30M}
    catalog:
      - id: claude-opus-4-8
        label: "Claude Opus 4.8"
        tier: forte
        description: "Máxima capacidade — análise difícil, rotas de risco alto."
      - id: claude-sonnet-5
        label: "Claude Sonnet 5"
        tier: forte
        description: "Forte e equilibrado — default para integração e risco."
      - id: claude-sonnet-4-5
        label: "Claude Sonnet 4.5"
        tier: default
        description: "Geração anterior do Sonnet — aceita 'temperature'."
      - id: claude-haiku-4-5
        label: "Claude Haiku 4.5"
        tier: rapido
        description: "Rápido e barato — FAQ/atendimento de baixo risco."

# ---------- Portal de componentes (ACL) ----------
component:
  portal:
    base-url: ${COMPONENT_PORTAL_BASE_URL:https://portal.example.com/api}
    token: ${COMPONENT_PORTAL_TOKEN:}

logging:
  level:
    org.springframework.ai: INFO
    com.example.agenticrag: DEBUG

name: Quality Gate (O Portão)

# M03 · Camada 5 (Governança). "Quality gate: avaliar ANTES de subir".
# Dispara nos PRs que mexem em prompt, golden set, modelo ou na recuperação — a tríade
# versionada junto: qualidade = f(prompt, golden, modelo). O gate roda o golden set pela
# recuperação e BARRA o merge se a qualidade regredir (endpoint /quality/{id}/gate → 422).
# Não usa LLM nem chave: o gate mede RECUPERAÇÃO (a causa raiz da maioria das alucinações).

on:
  pull_request:
    paths:
      - 'src/main/resources/golden/**'
      - 'src/main/java/com/example/agenticrag/advisor/**'
      - 'src/main/java/com/example/agenticrag/quality/**'
      - 'src/main/java/com/example/agenticrag/routing/**'
      - 'src/main/resources/application*.yml'
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ragdb
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build (skip tests — o gate é o teste aqui)
        run: mvn -B -ntp -DskipTests package

      - name: Subir a app (perfil mock, sem chave — o gate usa só recuperação)
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ragdb
          DB_USERNAME: rag
          DB_PASSWORD: rag
        run: |
          java -jar target/agentic-rag-*.jar --spring.profiles.active=mock &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Aguardar health (modelo de embeddings baixa na 1ª subida)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              echo "app UP"; exit 0
            fi
            sleep 5
          done
          echo "app não subiu a tempo"; exit 1

      - name: Ingerir o componente de exemplo
        run: curl -sf -X POST http://localhost:8080/api/v1/components/payments-sdk/ingest

      - name: Rodar o Portão (falha o job se o gate reprovar → bloqueia o merge)
        run: |
          echo "== Quality Gate =="
          curl -sf -X POST http://localhost:8080/api/v1/quality/payments-sdk/gate | tee gate-report.json
          echo
          echo "Gate PASSOU."

      - name: Publicar relatório do gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: gate-report.json
          if-no-files-found: ignore
